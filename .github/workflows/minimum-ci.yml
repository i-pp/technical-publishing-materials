name: Minimum CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum:
    name: Minimum source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tracked text and local documentation links
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import urllib.parse
          root = pathlib.Path.cwd()
          paths = [p for p in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0") if p]
          if not paths:
              raise SystemExit("Empty source inventory")
          checked = 0
          for name in paths:
              path = root / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit("Unsupported source entry: " + name)
              text = path.read_text(encoding="utf-8")
              if not text.strip():
                  raise SystemExit("Empty tracked file: " + name)
              if path.suffix == ".json":
                  json.loads(text)
              if path.suffix == ".md":
                  for match in re.finditer(r"(?<!!)\[[^\]]*\]\(([^)\s]+)\)", text):
                      link = urllib.parse.urlsplit(match.group(1))
                      if link.scheme or link.netloc or not link.path:
                          continue
                      target = (path.parent / urllib.parse.unquote(link.path)).resolve()
                      if not target.is_relative_to(root) or not target.exists():
                          raise SystemExit("Missing or outside local link: " + name)
              checked += 1
          print(f"Validated {checked} tracked UTF-8 source files and local Markdown links")
          PY

  license:
    name: License policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve the reviewed checker artifact
        shell: bash
        env:
          CHECKER_URL: https://github.com/i-pp/license-check-ci/releases/download/v0.1.0/license-check-0.1.0.pyz
          CHECKER_SHA256: 2f48645fe866af8bdbe82de5665b05e79188c53f09daf0852fcc71fa6559ef0b
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --retry 2 \
            "$CHECKER_URL" -o "$RUNNER_TEMP/license-check.pyz"
          printf '%s  %s\n' "$CHECKER_SHA256" "$RUNNER_TEMP/license-check.pyz" | sha256sum --check --strict -
      - name: Verify declared license evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B "$RUNNER_TEMP/license-check.pyz" \
            --root "$GITHUB_WORKSPACE" \
            --policy .github/license-policy.json \
            --report "$RUNNER_TEMP/license-report.json"
          test -s "$RUNNER_TEMP/license-report.json"
  minimum_ci:
    name: Minimum CI
    needs: [minimum, license]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all minimum checks to succeed
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.minimum.result }}
          LICENSE_RESULT: ${{ needs.license.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$LICENSE_RESULT" = success
